<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Rodinný Kalendář</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-border { border: 1px solid #e2e8f0 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-2 sm:p-4 md:p-6 antialiased flex flex-col">
  
  <div class="max-w-7xl mx-auto w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden flex flex-col flex-1">
    
    <!-- Horní navigační lišta -->
    <header class="p-4 sm:px-6 bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 flex flex-wrap items-center justify-between gap-3 no-print">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-100 text-lg">
          🗓️
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">Rodinný Kalendář</h1>
            <!-- Stav online připojení -->
            <span id="syncIndicator" class="flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-50 text-amber-700 border border-amber-200">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> Připojuji...
            </span>
          </div>
          <p class="text-xs sm:text-sm font-semibold text-slate-500" id="currentRangeLabel">Plánování</p>
        </div>
      </div>

      <!-- Tlačítka posunu -->
      <div class="flex items-center gap-2 ml-auto sm:ml-0">
        <div class="inline-flex rounded-xl border border-slate-200 bg-slate-50 p-1 shadow-inner">
          <button id="prevBtn" class="p-1.5 px-3 rounded-lg hover:bg-white text-slate-700 font-semibold transition active:scale-95 shadow-sm hover:shadow">◀</button>
          <button id="todayBtn" class="px-3 py-1.5 rounded-lg hover:bg-white text-xs sm:text-sm font-bold text-slate-800 transition active:scale-95 shadow-sm hover:shadow">Dnes</button>
          <button id="nextBtn" class="p-1.5 px-3 rounded-lg hover:bg-white text-slate-700 font-semibold transition active:scale-95 shadow-sm hover:shadow">▶</button>
        </div>

        <select id="viewDays" class="text-xs sm:text-sm font-medium border border-slate-200 rounded-xl px-3 py-2 bg-slate-50 text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          <option value="7">7 dní</option>
          <option value="14" selected>14 dní</option>
          <option value="30">Celý měsíc</option>
        </select>

        <button onclick="window.print()" title="Vytisknout na ledničku" class="p-2 sm:px-3 sm:py-2 text-xs sm:text-sm font-semibold border border-slate-200 rounded-xl bg-slate-50 hover:bg-white text-slate-700 shadow-sm transition flex items-center gap-1.5">
          <span>🖨️</span> <span class="hidden md:inline">Tisk</span>
        </button>
      </div>
    </header>

    <!-- Hlavička sloupců se členy -->
    <div class="grid grid-cols-[85px_repeat(3,1fr)] sm:grid-cols-[130px_repeat(3,1fr)] bg-slate-50/90 backdrop-blur-md border-b border-slate-200 font-bold text-xs sm:text-sm sticky top-[73px] sm:top-[77px] z-20 shadow-sm text-slate-700">
      <div class="p-3 text-center border-r border-slate-200 bg-slate-100/60 flex items-center justify-center tracking-wider uppercase text-[11px] text-slate-400">Den</div>
      <div class="p-3 text-center border-r border-slate-200 bg-sky-50/60 text-sky-900 flex items-center justify-center gap-2">
        <span class="w-3 h-3 rounded-full bg-sky-500 shadow-sm shadow-sky-200"></span> Táta
      </div>
      <div class="p-3 text-center border-r border-slate-200 bg-rose-50/60 text-rose-900 flex items-center justify-center gap-2">
        <span class="w-3 h-3 rounded-full bg-rose-500 shadow-sm shadow-rose-200"></span> Máma
      </div>
      <div class="p-3 text-center bg-violet-50/60 text-violet-900 flex items-center justify-center gap-2">
        <span class="w-3 h-3 rounded-full bg-violet-500 shadow-sm shadow-violet-200"></span> Bára
      </div>
    </div>

    <!-- Mřížka kalendáře -->
    <div id="calendarGrid" class="divide-y divide-slate-100 flex-1 overflow-y-auto print-border">
      <!-- Dny se vykreslují ihned -->
    </div>
  </div>

  <!-- Modální okno pro novou událost -->
  <div id="eventModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 transform transition-all">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-lg font-bold text-slate-900" id="modalTitle">Nová událost</h3>
        <button type="button" id="closeModalCross" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
      </div>
      <p class="text-xs font-semibold text-slate-400 mb-4" id="modalSubtitle">Vyberte podrobnosti</p>
      
      <form id="eventForm" class="space-y-4">
        <input type="hidden" id="modalDate">
        <input type="hidden" id="modalPerson">

        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Popis / Plán</label>
          <input type="text" id="eventTitle" placeholder="např. Trénink, Zubař, Kroužek, Oslava..." required autofocus
                 class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50 focus:bg-white transition">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Čas (nepovinné)</label>
            <input type="time" id="eventTime" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Štítek / Typ</label>
            <select id="eventTag" class="w-full border border-slate-200 rounded-xl px-2 py-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50 focus:bg-white transition">
              <option value="general">📍 Běžné</option>
              <option value="sport">⚽ Sport / Trénink</option>
              <option value="school">🎒 Škola / Kroužek</option>
              <option value="doctor">🩺 Lékař / Zubař</option>
              <option value="work">💼 Práce</option>
              <option value="fun">🎉 Výlet / Oslava</option>
            </select>
          </div>
        </div>

        <!-- Možnost nastavit jako společnou rodinnou událost -->
        <div class="pt-1">
          <label class="inline-flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="eventIsFamily" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
            <span class="text-xs font-semibold text-slate-700">Týká se celé rodiny (společné)</span>
          </label>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" id="cancelModalBtn" class="px-4 py-2.5 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">Zrušit</button>
          <button type="submit" id="saveEventBtn" class="px-5 py-2.5 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-100 transition active:scale-95 flex items-center gap-1.5">
            <span>Uložit</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ KONFIGURACE SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://pdricsmhdtjldrbgbvej.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkcmljc21oZHRqbGRyYmdidmVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjgxNjUsImV4cCI6MjEwNjU0NDE2NX0.LP2-9jFVLIAps7cJ5LuegfzZ2KBBUmWE2ltwgmE8SAE";

    let supabase = null;
    try {
      if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.error("Chyba inicializace Supabase:", err);
    }

    const members = [
      { id: 'tata', name: 'Táta', color: 'sky' },
      { id: 'mama', name: 'Máma', color: 'rose' },
      { id: 'barca', name: 'Bára', color: 'violet' }
    ];

    let startDate = new Date();
    startDate.setHours(0, 0, 0, 0);

    let daysCount = 14;
    let eventsList = [];

    const daysNames = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
    const monthsNames = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];

    // DOM Prvky
    const calendarGrid = document.getElementById('calendarGrid');
    const currentRangeLabel = document.getElementById('currentRangeLabel');
    const viewDaysSelect = document.getElementById('viewDays');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const todayBtn = document.getElementById('todayBtn');
    const syncIndicator = document.getElementById('syncIndicator');

    const eventModal = document.getElementById('eventModal');
    const eventForm = document.getElementById('eventForm');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const closeModalCross = document.getElementById('closeModalCross');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalDate = document.getElementById('modalDate');
    const modalPerson = document.getElementById('modalPerson');
    const eventTitle = document.getElementById('eventTitle');
    const eventTime = document.getElementById('eventTime');
    const eventTag = document.getElementById('eventTag');
    const eventIsFamily = document.getElementById('eventIsFamily');
    const saveEventBtn = document.getElementById('saveEventBtn');

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // --- VYKRESLENÍ KALENDÁŘE (BĚŽÍ OKAMŽITĚ) ---
    function renderCalendar() {
      calendarGrid.innerHTML = '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayKey = formatDateKey(today);

      const endDate = new Date(startDate);
      endDate.setDate(startDate.getDate() + daysCount - 1);

      currentRangeLabel.textContent = `${startDate.getDate()}. ${monthsNames[startDate.getMonth()]} – ${endDate.getDate()}. ${monthsNames[endDate.getMonth()]} ${endDate.getFullYear()}`;

      for (let i = 0; i < daysCount; i++) {
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);
        const dateKey = formatDateKey(d);

        const isToday = dateKey === todayKey;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;

        const row = document.createElement('div');
        row.className = `grid grid-cols-[85px_repeat(3,1fr)] sm:grid-cols-[130px_repeat(3,1fr)] min-h-[90px] transition-colors ${
          isToday ? 'bg-amber-50/40' : (isWeekend ? 'bg-slate-50/70' : 'bg-white')
        }`;

        const dayCell = document.createElement('div');
        dayCell.className = `p-2 sm:p-3 border-r border-slate-200 flex flex-col justify-center items-center text-center select-none ${
          isToday ? 'border-l-4 border-l-amber-500 bg-amber-50/50' : ''
        }`;
        dayCell.innerHTML = `
          <span class="text-[10px] sm:text-xs font-bold ${isWeekend ? 'text-rose-500' : 'text-slate-400'} uppercase tracking-wider">${daysNames[d.getDay()]}</span>
          <span class="text-base sm:text-xl font-extrabold ${isToday ? 'text-amber-600' : 'text-slate-800'} mt-0.5">${d.getDate()}. ${d.getMonth() + 1}.</span>
        `;
        row.appendChild(dayCell);

        const dayEvents = eventsList.filter(ev => ev.date === dateKey);

        members.forEach(m => {
          const cell = document.createElement('div');
          cell.className = "p-1.5 sm:p-2.5 border-r border-slate-100 last:border-r-0 flex flex-col gap-1.5 relative group hover:bg-slate-50/60 transition cursor-pointer";

          const memberEvents = dayEvents.filter(ev => ev.person === m.id || ev.person === 'all');
          memberEvents.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

          const eventsContainer = document.createElement('div');
          eventsContainer.className = "flex flex-col gap-1.5 w-full";

          memberEvents.forEach(ev => {
            const isFamily = ev.person === 'all';
            const evEl = document.createElement('div');
            
            let colorClasses = isFamily
              ? 'bg-amber-100/80 border-amber-300 text-amber-950 font-medium'
              : (m.id === 'tata' ? 'bg-sky-50 border-sky-200 text-sky-950' :
                 m.id === 'mama' ? 'bg-rose-50 border-rose-200 text-rose-950' :
                 'bg-violet-50 border-violet-200 text-violet-950');

            evEl.className = `text-[11px] sm:text-xs px-2 py-1.5 rounded-xl shadow-xs border flex items-center justify-between gap-1 group/item transition-all hover:scale-[1.01] ${colorClasses}`;
            
            evEl.innerHTML = `
              <div class="truncate flex items-center gap-1.5">
                ${ev.time ? `<span class="font-bold opacity-75">${ev.time}</span>` : ''}
                <span class="truncate">${isFamily ? '⭐ ' : ''}${ev.title}</span>
              </div>
              <button data-id="${ev.id}" class="text-slate-400 hover:text-rose-600 opacity-0 group-hover/item:opacity-100 transition px-1 font-bold no-print">✕</button>
            `;

            evEl.querySelector('button').addEventListener('click', async (e) => {
              e.stopPropagation();
              await deleteEvent(ev.id);
            });

            eventsContainer.appendChild(evEl);
          });

          cell.appendChild(eventsContainer);

          const addBtn = document.createElement('button');
          addBtn.className = "mt-auto text-[10px] sm:text-xs font-semibold text-slate-400 opacity-0 group-hover:opacity-100 transition flex items-center gap-1 hover:text-indigo-600 py-1 no-print";
          addBtn.innerHTML = `<span>+ Přidat</span>`;
          cell.appendChild(addBtn);

          cell.addEventListener('click', () => openModal(dateKey, m, d));
          row.appendChild(cell);
        });

        calendarGrid.appendChild(row);
      }
    }

    // --- NAČÍTÁNÍ ZE SUPABASE ---
    async function loadEvents() {
      if (!supabase) {
        setIndicator('Offline / Lokální', 'amber');
        eventsList = JSON.parse(localStorage.getItem('family_events_demo') || '[]');
        renderCalendar();
        return;
      }

      try {
        const { data, error } = await supabase.from('family_events').select('*');
        if (error) {
          console.warn("Chyba při stahování ze Supabase:", error);
          setIndicator('Chyba DB (lokální)', 'rose');
          eventsList = JSON.parse(localStorage.getItem('family_events_demo') || '[]');
        } else {
          eventsList = data || [];
          setIndicator('Live', 'emerald');
        }
      } catch (err) {
        console.error("Síťová chyba:", err);
        setIndicator('Chyba spojení', 'rose');
        eventsList = JSON.parse(localStorage.getItem('family_events_demo') || '[]');
      }
      renderCalendar();
    }

    function setIndicator(text, color) {
      if (color === 'emerald') {
        syncIndicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> ${text}`;
        syncIndicator.className = 'flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';
      } else if (color === 'rose') {
        syncIndicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> ${text}`;
        syncIndicator.className = 'flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-50 text-rose-700 border border-rose-200';
      } else {
        syncIndicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> ${text}`;
        syncIndicator.className = 'flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-50 text-amber-700 border border-amber-200';
      }
    }

    function subscribeToRealtime() {
      if (!supabase) return;
      try {
        supabase
          .channel('family_events_channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'family_events' }, () => {
            loadEvents();
          })
          .subscribe();
      } catch (e) {
        console.warn("Realtime se nepodařilo připojit:", e);
      }
    }

    function openModal(dateKey, member, dateObj) {
      modalDate.value = dateKey;
      modalPerson.value = member.id;
      modalTitle.textContent = `Nová událost: ${member.name}`;
      modalSubtitle.textContent = `${daysNames[dateObj.getDay()]} ${dateObj.getDate()}. ${monthsNames[dateObj.getMonth()]}`;
      eventTitle.value = '';
      eventTime.value = '';
      eventIsFamily.checked = false;
      eventModal.classList.remove('hidden');
      eventModal.classList.add('flex');
      setTimeout(() => eventTitle.focus(), 60);
    }

    function closeModal() {
      eventModal.classList.add('hidden');
      eventModal.classList.remove('flex');
    }

    eventForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = modalDate.value;
      const person = eventIsFamily.checked ? 'all' : modalPerson.value;
      const title = eventTitle.value.trim();
      const time = eventTime.value;
      const tag = eventTag.value;

      if (!title) return;

      saveEventBtn.disabled = true;
      saveEventBtn.textContent = 'Ukládám...';

      let saved = false;
      if (supabase) {
        try {
          const { error } = await supabase.from('family_events').insert([{ date, person, title, time, tag }]);
          if (!error) saved = true;
          else console.warn("Supabase insert chyba:", error);
        } catch (err) {
          console.warn("Chyba při zápisu do DB:", err);
        }
      }

      if (!saved) {
        // Fallback pro lokální uložení, aby aplikace nezamrzla
        eventsList.push({ id: Date.now().toString(), date, person, title, time, tag });
        localStorage.setItem('family_events_demo', JSON.stringify(eventsList));
        renderCalendar();
      }

      saveEventBtn.disabled = false;
      saveEventBtn.textContent = 'Uložit';
      closeModal();
      if (supabase && saved) loadEvents();
    });

    async function deleteEvent(id) {
      if (supabase) {
        try {
          await supabase.from('family_events').delete().eq('id', id);
        } catch (e) {
          console.warn("Chyba při mazání v DB:", e);
        }
      }
      eventsList = eventsList.filter(ev => ev.id !== id);
      localStorage.setItem('family_events_demo', JSON.stringify(eventsList));
      renderCalendar();
    }

    cancelModalBtn.addEventListener('click', closeModal);
    closeModalCross.addEventListener('click', closeModal);
    eventModal.addEventListener('click', (e) => { if (e.target === eventModal) closeModal(); });

    prevBtn.addEventListener('click', () => { startDate.setDate(startDate.getDate() - daysCount); renderCalendar(); });
    nextBtn.addEventListener('click', () => { startDate.setDate(startDate.getDate() + daysCount); renderCalendar(); });
    todayBtn.addEventListener('click', () => { startDate = new Date(); startDate.setHours(0,0,0,0); renderCalendar(); });
    viewDaysSelect.addEventListener('change', (e) => { daysCount = parseInt(e.target.value, 10); renderCalendar(); });

    // 1. Okamžité vykreslení prázdného kalendáře
    renderCalendar();
    // 2. Načtení dat a realtime odběr
    loadEvents();
    subscribeToRealtime();
  </script>
</body>
</html>
